<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI WebSocket Task</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 600px; margin: 50px auto; line-height: 1.6; }
        .container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-top: 20px; background: #fafafa; }
        .input-group { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Сообщения</h2>
    <div class="input-group">
        <input type="text" id="msgInput" placeholder="Введите текст..." autocomplete="off">
        <button onclick="send()">Отправить</button>
    </div>

    <div id="messages"></div>
</div>

<script>
    const msgList = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');

    const socket = new WebSocket(`ws://${window.location.host}/ws`);

    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const item = document.createElement('div');
        item.textContent = `${data.number}. ${data.text}`;
        msgList.appendChild(item);
        msgList.scrollTop = msgList.scrollHeight;
    };

    function send() {
        if (msgInput.value.trim()) {
            const payload = { "text": msgInput.value };
            socket.send(JSON.stringify(payload));
            msgInput.value = '';
        }
    }

    msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") send(); });
</script>

</body>
</html>
